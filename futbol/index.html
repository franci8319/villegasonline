<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fútbol — Villegas Online</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #1a4a8a;
      --surface:  rgba(255,255,255,0.10);
      --text:     #ffffff;
      --text-sub: rgba(255,255,255,0.55);
      --live:     #ff3b30;
      --live-bg:  rgba(255,59,48,0.18);
    }

    html, body {
      min-height: 100dvh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    header {
      text-align: center;
      padding: 52px 20px 4px;
      user-select: none;
      -webkit-user-select: none;
      pointer-events: none;
    }
    header h1 {
      font-family: "Pinyon Script", cursive;
      font-size: 36px;
      font-weight: 400;
    }

    .fecha {
      text-align: center;
      font-size: 12px;
      color: var(--text-sub);
      letter-spacing: 0.5px;
      padding: 6px 0 14px;
      text-transform: uppercase;
    }

    /* ── Filtros ── */
    .filtros-wrap {
      overflow-x: auto;
      scrollbar-width: none;
      padding: 0 16px 12px;
    }
    .filtros-wrap::-webkit-scrollbar { display: none; }
    .filtros-row { display: flex; gap: 8px; width: max-content; }

    .filtro {
      padding: 6px 16px;
      border-radius: 20px;
      background: var(--surface);
      color: var(--text-sub);
      font-size: 13px;
      font-weight: 500;
      border: none;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      -webkit-tap-highlight-color: transparent;
      white-space: nowrap;
    }
    .filtro.active { background: rgba(255,255,255,0.9); color: var(--bg); font-weight: 600; }
    .filtro .badge {
      display: inline-block;
      background: var(--live);
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      border-radius: 8px;
      padding: 1px 5px;
      margin-left: 4px;
      vertical-align: middle;
    }

    .refresh-info {
      text-align: center;
      font-size: 11px;
      color: var(--text-sub);
      padding-bottom: 8px;
    }

    /* ── Contenido ── */
    .contenido {
      padding: 0 12px 80px;
      max-width: 640px;
      margin: 0 auto;
    }

    /* ── Liga ── */
    .liga-section { margin-bottom: 16px; }

    .liga-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 4px 6px;
    }
    .liga-header img {
      width: 20px;
      height: 20px;
      object-fit: contain;
    }
    .liga-header span {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }

    /* ── Partido ── */
    .partido {
      background: var(--surface);
      border-radius: 12px;
      padding: 10px 14px 10px;
      margin-bottom: 4px;
    }

    .partido-fila {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 8px;
    }

    .equipo {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }
    .equipo.away { flex-direction: row-reverse; }

    .equipo img {
      width: 24px;
      height: 24px;
      object-fit: contain;
      flex-shrink: 0;
    }

    .equipo-nombre {
      font-size: 14px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .equipo.away .equipo-nombre { text-align: right; }

    .centro {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      flex-shrink: 0;
      min-width: 72px;
    }

    .marcador {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .hora {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-sub);
    }

    .estado-live {
      font-size: 10px;
      font-weight: 700;
      color: var(--live);
      background: var(--live-bg);
      padding: 2px 7px;
      border-radius: 6px;
      letter-spacing: 0.5px;
      animation: pulso 1.5s infinite;
    }

    .estado-ft {
      font-size: 10px;
      color: var(--text-sub);
      letter-spacing: 0.5px;
    }

    @keyframes pulso {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.4; }
    }

    /* ── Canales ── */
    .canales {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 8px;
      padding-top: 7px;
      border-top: 1px solid rgba(255,255,255,0.08);
    }

    .canal-chip {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 8px;
      color: #fff;
      white-space: nowrap;
    }

    .estado {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-sub);
      font-size: 15px;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <header><h1>Fútbol</h1></header>
  <div class="fecha" id="fecha"></div>

  <div class="filtros-wrap">
    <div class="filtros-row">
      <button class="filtro active" onclick="setFiltro('todos',this)">Todos</button>
      <button class="filtro" onclick="setFiltro('live',this)">En juego <span class="badge" id="badge-live" style="display:none">0</span></button>
      <button class="filtro" onclick="setFiltro('proximos',this)">Próximos</button>
      <button class="filtro" onclick="setFiltro('finalizados',this)">Finalizados</button>
    </div>
  </div>

  <div class="refresh-info" id="refresh-info"></div>
  <div class="contenido" id="contenido"><div class="estado">Cargando...</div></div>

  <script>
    function colorCanal(nombre) {
      const n = nombre.toLowerCase();
      if (n.includes('dazn'))                       return '#0a5a8a';
      if (n.includes('movistar') || n.includes('m+')) return '#004f9f';
      if (n.includes('laliga') || n.includes('la liga')) return '#c07000';
      if (n.includes('teledeporte'))                return '#8b0000';
      if (n.includes('tve') || n.includes('la 1')) return '#8b0000';
      if (n.includes('bein'))                       return '#7b0000';
      if (n.includes('eurosport'))                  return '#003da5';
      if (n.includes('orange'))                     return '#b54000';
      if (n.includes('gol'))                        return '#005010';
      if (n.includes('sky'))                        return '#005ca9';
      return 'rgba(255,255,255,0.18)';
    }

    function centroHtml(p) {
      if (p.estado === 'proximo') {
        return `<span class="hora">${p.hora}</span>`;
      }
      const gL = p.golesLocal ?? 0;
      const gV = p.golesVisitante ?? 0;
      const marc = `<span class="marcador">${gL} - ${gV}</span>`;
      if (p.estado === 'live') {
        const min = p.minuto ? p.minuto + "'" : 'EN JUEGO';
        return marc + `<span class="estado-live">${min}</span>`;
      }
      return marc + `<span class="estado-ft">FT</span>`;
    }

    function canalesHtml(canales) {
      if (!canales || !canales.length) return '';
      return `<div class="canales">${canales.map(c =>
        `<span class="canal-chip" style="background:${colorCanal(c)}">${c}</span>`
      ).join('')}</div>`;
    }

    function partidoHtml(p) {
      return `
        <div class="partido" data-estado="${p.estado}">
          <div class="partido-fila">
            <div class="equipo home">
              <img src="${p.logoLocal}" onerror="this.style.display='none'" loading="lazy">
              <span class="equipo-nombre">${p.local}</span>
            </div>
            <div class="centro">${centroHtml(p)}</div>
            <div class="equipo away">
              <img src="${p.logoVisitante}" onerror="this.style.display='none'" loading="lazy">
              <span class="equipo-nombre">${p.visitante}</span>
            </div>
          </div>
          ${canalesHtml(p.canales)}
        </div>`;
    }

    let _filtroActivo = 'todos';
    let _data = null;
    let _timer = null;

    function setFiltro(f, btn) {
      _filtroActivo = f;
      document.querySelectorAll('.filtro').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      if (_data) render(_data);
    }
    window.setFiltro = setFiltro;

    function render(data) {
      const cont = document.getElementById('contenido');

      // Aplanar todos los partidos con el nombre de competición
      const todos = data.competiciones.flatMap(c =>
        c.partidos.map(p => ({ ...p, _comp: c.nombre, _fotmob: c.fotmobId }))
      );

      const lista = _filtroActivo === 'todos'       ? todos
                  : _filtroActivo === 'live'        ? todos.filter(p => p.estado === 'live')
                  : _filtroActivo === 'proximos'    ? todos.filter(p => p.estado === 'proximo')
                  : todos.filter(p => p.estado === 'finalizado');

      if (!lista.length) {
        cont.innerHTML = '<div class="estado">No hay partidos en este filtro.</div>';
        return;
      }

      // Reagrupar por competición manteniendo el orden original
      const porComp = {};
      lista.forEach(p => {
        if (!porComp[p._comp]) porComp[p._comp] = { nombre: p._comp, fotmob: p._fotmob, lista: [] };
        porComp[p._comp].lista.push(p);
      });

      const logoUrl = id => id
        ? `https://images.fotmob.com/image_resources/logo/leaguelogo/dark/${id}.png`
        : null;

      cont.innerHTML = Object.values(porComp).map(g => {
        const logo = logoUrl(g.fotmob);
        return `
          <div class="liga-section">
            <div class="liga-header">
              ${logo ? `<img src="${logo}" onerror="this.style.display='none'" loading="lazy">` : ''}
              <span>${g.nombre}</span>
            </div>
            ${g.lista.map(partidoHtml).join('')}
          </div>`;
      }).join('');

      // Badge en juego
      const nLive = todos.filter(p => p.estado === 'live').length;
      const badge = document.getElementById('badge-live');
      badge.textContent  = nLive;
      badge.style.display = nLive ? 'inline-block' : 'none';

      // Info
      const ahora = new Date().toLocaleTimeString('es', {
        timeZone: 'Europe/Madrid', hour: '2-digit', minute: '2-digit'
      });
      const upd = data.actualizado
        ? new Date(data.actualizado).toLocaleTimeString('es', {
            timeZone: 'Europe/Madrid', hour: '2-digit', minute: '2-digit'
          })
        : ahora;
      document.getElementById('refresh-info').textContent = nLive
        ? `Datos de las ${upd} · se actualiza cada 5 min`
        : `Datos de las ${upd}`;

      // Auto-refresco cada 5 min si hay partidos en juego
      if (_timer) clearTimeout(_timer);
      if (nLive) _timer = setTimeout(cargar, 5 * 60 * 1000);
    }

    async function cargar() {
      try {
        const r    = await fetch(`partidos.json?t=${Date.now()}`);
        const data = await r.json();
        _data = data;

        if (!data.competiciones || !data.competiciones.length) {
          document.getElementById('contenido').innerHTML =
            '<div class="estado">No hay partidos disponibles aún.<br>Vuelve más tarde.</div>';
          return;
        }

        render(data);
      } catch {
        document.getElementById('contenido').innerHTML =
          '<div class="estado">Error cargando partidos.<br>Comprueba la conexión.</div>';
      }
    }

    document.getElementById('fecha').textContent = new Date().toLocaleDateString('es', {
      weekday: 'long', day: 'numeric', month: 'long', timeZone: 'Europe/Madrid'
    });

    cargar();
  </script>
</body>
</html>
