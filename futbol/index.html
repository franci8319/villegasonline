<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fútbol — Villegas Online</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #1a4a8a;
      --surface:  rgba(255,255,255,0.10);
      --text:     #ffffff;
      --text-sub: rgba(255,255,255,0.55);
      --live:     #ff3b30;
      --live-bg:  rgba(255,59,48,0.18);
    }

    html, body {
      min-height: 100dvh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    header {
      text-align: center;
      padding: 52px 20px 4px;
      user-select: none;
      -webkit-user-select: none;
      pointer-events: none;
    }
    header h1 {
      font-family: "Pinyon Script", cursive;
      font-size: 36px;
      font-weight: 400;
    }

    .refresh-info {
      text-align: center;
      font-size: 11px;
      color: var(--text-sub);
      padding: 4px 0 0;
    }

    /* ── Tabs de fecha ── */
    .tabs-wrap {
      overflow-x: auto;
      scrollbar-width: none;
      padding: 14px 16px 14px;
    }
    .tabs-wrap::-webkit-scrollbar { display: none; }
    .tabs-row {
      display: flex;
      gap: 8px;
      width: max-content;
    }
    .tab {
      padding: 6px 16px;
      border-radius: 20px;
      background: var(--surface);
      color: var(--text-sub);
      font-size: 13px;
      font-weight: 500;
      border: none;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      -webkit-tap-highlight-color: transparent;
      white-space: nowrap;
    }
    .tab.active { background: rgba(255,255,255,0.9); color: var(--bg); font-weight: 600; }

    /* ── Contenido ── */
    .contenido {
      padding: 0 12px 80px;
      max-width: 640px;
      margin: 0 auto;
    }

    /* ── Liga ── */
    .liga-section { margin-bottom: 16px; }

    .liga-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 4px 6px;
    }
    .liga-header img {
      width: 20px;
      height: 20px;
      object-fit: contain;
    }
    .liga-header span {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }

    /* ── Partido ── */
    .partido {
      background: var(--surface);
      border-radius: 12px;
      padding: 10px 14px 10px;
      margin-bottom: 4px;
      transition: opacity 0.2s;
    }
    .partido.pasado { opacity: 0.45; }

    .partido-fila {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 8px;
    }

    .equipo {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }
    .equipo.away { flex-direction: row-reverse; }

    .equipo-ini {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: rgba(255,255,255,0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 8px;
      font-weight: 700;
      flex-shrink: 0;
      color: #fff;
    }

    .equipo-nombre {
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .equipo.away .equipo-nombre { text-align: right; }

    .centro {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      flex-shrink: 0;
      min-width: 70px;
    }

    .hora {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .vs-sep {
      font-size: 11px;
      color: var(--text-sub);
      font-weight: 500;
    }

    .live-badge {
      font-size: 10px;
      font-weight: 700;
      color: var(--live);
      background: var(--live-bg);
      padding: 2px 7px;
      border-radius: 6px;
      letter-spacing: 0.5px;
      animation: pulso 1.5s infinite;
    }

    @keyframes pulso {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.4; }
    }

    /* ── Canales ── */
    .canales {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 8px;
      padding-top: 7px;
      border-top: 1px solid rgba(255,255,255,0.08);
    }

    .canal-chip {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 8px;
      color: #fff;
      white-space: nowrap;
    }

    /* ── Estado vacío / carga ── */
    .estado {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-sub);
      font-size: 15px;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <header><h1>Fútbol</h1></header>
  <div class="refresh-info" id="refresh-info"></div>

  <div class="tabs-wrap">
    <div class="tabs-row" id="tabs"></div>
  </div>

  <div class="contenido" id="contenido">
    <div class="estado">Cargando...</div>
  </div>

  <script>
    const API_KEY  = '377f6b2cdamsh3512a63c8914e18p1d56a8jsn5d27e0e9aede';
    const API_HOST = 'wosti-futbol-tv-spain.p.rapidapi.com';

    // Fotmob league IDs para logos
    const COMP_FOTMOB = {
      'premier league':          47,
      'laliga':                  87,
      'la liga':                 87,
      'champions league':        42,
      'uefa champions league':   42,
      'europa league':           73,
      'uefa europa league':      73,
      'conference league':       155,
      'bundesliga':              54,
      'serie a':                 55,
      'ligue 1':                 53,
      'copa del rey':            138,
      'fa cup':                  132,
      'copa america':            77,
      'mundial':                 77,
    };

    function logoLiga(nombre) {
      const id = COMP_FOTMOB[nombre.toLowerCase()];
      return id ? `https://images.fotmob.com/image_resources/logo/leaguelogo/dark/${id}.png` : null;
    }

    function madridDate(utcStr) {
      return new Date(utcStr).toLocaleDateString('sv', { timeZone: 'Europe/Madrid' });
    }

    function madridHora(utcStr) {
      return new Date(utcStr).toLocaleTimeString('es', {
        timeZone: 'Europe/Madrid', hour: '2-digit', minute: '2-digit'
      });
    }

    function estadoPartido(utcStr) {
      const diff = Date.now() - new Date(utcStr).getTime();
      if (diff < -5 * 60 * 1000)    return 'proximo';
      if (diff < 130 * 60 * 1000)   return 'live';
      return 'pasado';
    }

    function colorCanal(nombre) {
      const n = nombre.toLowerCase();
      if (n.includes('dazn'))                       return '#0a5a8a';
      if (n.includes('movistar'))                   return '#004f9f';
      if (n.includes('laliga') || n.includes('la liga')) return '#c07000';
      if (n.includes('bein'))                       return '#7b0000';
      if (n.includes('eurosport'))                  return '#003da5';
      if (n.includes('la 1') || n.includes('tve')) return '#a5000a';
      if (n.includes('orange'))                     return '#b54000';
      if (n.includes('gol'))                        return '#005010';
      if (n.includes('sky'))                        return '#005ca9';
      return 'rgba(255,255,255,0.18)';
    }

    function limpiarNombre(name) {
      return name
        .replace(/\s*\(Ver en directo\)/gi, '')
        .replace(/\s*\([MmOo]\d+[^)]*\)/g, '')
        .replace(/\s*\(\d+\)/g, '')
        .replace(/\s*:\s*VER PARTIDO/gi, '')
        .replace(/LALIGA TV Hypermotion/i, 'LaLiga TV Hyp.')
        .replace(/Movistar Plus\+/i, 'Movistar+')
        .trim();
    }

    function limpiarCanales(channels) {
      const vistos = new Set();
      return channels
        .filter(c => !c.Name.toLowerCase().includes(' bar'))
        .map(c => ({ nombre: limpiarNombre(c.Name) }))
        .filter(c => {
          if (vistos.has(c.nombre)) return false;
          vistos.add(c.nombre);
          return true;
        });
    }

    function iniciales(name) {
      return name.split(/[\s.]+/).filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join('');
    }

    function partidoHtml(m) {
      const estado  = estadoPartido(m.Date);
      const hora    = madridHora(m.Date);
      const canales = limpiarCanales(m.Channels);

      const centroHtml = estado === 'live'
        ? `<span class="live-badge">EN DIRECTO</span>`
        : `<span class="hora">${hora}</span><span class="vs-sep">vs</span>`;

      const canalesHtml = canales.length
        ? `<div class="canales">${canales.map(c =>
            `<span class="canal-chip" style="background:${colorCanal(c.nombre)}">${c.nombre}</span>`
          ).join('')}</div>`
        : '';

      return `
        <div class="partido ${estado === 'pasado' ? 'pasado' : ''}">
          <div class="partido-fila">
            <div class="equipo home">
              <div class="equipo-ini">${iniciales(m.LocalTeam.Name)}</div>
              <span class="equipo-nombre">${m.LocalTeam.Name}</span>
            </div>
            <div class="centro">${centroHtml}</div>
            <div class="equipo away">
              <div class="equipo-ini">${iniciales(m.AwayTeam.Name)}</div>
              <span class="equipo-nombre">${m.AwayTeam.Name}</span>
            </div>
          </div>
          ${canalesHtml}
        </div>`;
    }

    let _eventos = [];

    function renderFecha(fecha) {
      const cont     = document.getElementById('contenido');
      const partidos = _eventos.filter(m => madridDate(m.Date) === fecha);

      if (!partidos.length) {
        cont.innerHTML = '<div class="estado">No hay partidos este día.</div>';
        return;
      }

      // Agrupar por competición
      const porComp = {};
      partidos.forEach(m => {
        const k = m.Competition.Name;
        if (!porComp[k]) porComp[k] = { nombre: k, lista: [] };
        porComp[k].lista.push(m);
      });

      // Ordenar cada grupo por hora
      Object.values(porComp).forEach(g => g.lista.sort((a, b) => new Date(a.Date) - new Date(b.Date)));

      cont.innerHTML = Object.values(porComp).map(g => {
        const logo    = logoLiga(g.nombre);
        const logoTag = logo
          ? `<img src="${logo}" onerror="this.style.display='none'" loading="lazy">`
          : '';
        return `
          <div class="liga-section">
            <div class="liga-header">${logoTag}<span>${g.nombre}</span></div>
            ${g.lista.map(partidoHtml).join('')}
          </div>`;
      }).join('');
    }

    window.seleccionarFecha = (fecha, btn) => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
      renderFecha(fecha);
    };

    async function cargar() {
      try {
        const hoyCache = new Date().toLocaleDateString('sv', { timeZone: 'Europe/Madrid' });
        const cache    = JSON.parse(localStorage.getItem('futbol_cache') || 'null');
        let data;

        if (cache && cache.fecha === hoyCache && Array.isArray(cache.eventos)) {
          data = cache.eventos;
          document.getElementById('refresh-info').textContent = 'Datos del día en caché';
        } else {
          const r = await fetch(`https://${API_HOST}/api/Events`, {
            headers: { 'x-rapidapi-key': API_KEY, 'x-rapidapi-host': API_HOST }
          });
          data = await r.json();
          if (!Array.isArray(data)) throw new Error('bad response');
          localStorage.setItem('futbol_cache', JSON.stringify({ fecha: hoyCache, eventos: data }));
        }

        _eventos = data;

        // Fechas únicas ordenadas
        const hoy    = new Date().toLocaleDateString('sv', { timeZone: 'Europe/Madrid' });
        const fechas = [...new Set(_eventos.map(m => madridDate(m.Date)))].sort();

        // Construir tabs
        const tabsEl = document.getElementById('tabs');
        tabsEl.innerHTML = fechas.map(f => {
          let label;
          const diff = Math.round((new Date(f) - new Date(hoy)) / 86400000);
          if (f === hoy)    label = 'Hoy';
          else if (diff === 1) label = 'Mañana';
          else label = new Date(f + 'T12:00:00').toLocaleDateString('es', { day: 'numeric', month: 'short' });
          return `<button class="tab" onclick="seleccionarFecha('${f}',this)">${label}</button>`;
        }).join('');

        // Seleccionar hoy o primera fecha disponible
        const fechaInicial = fechas.includes(hoy) ? hoy : fechas[0];
        const tabInicial   = tabsEl.querySelector(`button[onclick*="'${fechaInicial}'"]`);
        if (tabInicial) tabInicial.classList.add('active');
        renderFecha(fechaInicial);

        const ahora = new Date().toLocaleTimeString('es', {
          timeZone: 'Europe/Madrid', hour: '2-digit', minute: '2-digit'
        });
        document.getElementById('refresh-info').textContent = `Actualizado a las ${ahora}`;

      } catch(e) {
        document.getElementById('contenido').innerHTML =
          '<div class="estado">Error cargando partidos.<br>Comprueba la conexión.</div>';
      }
    }

    cargar();
  </script>
</body>
</html>
