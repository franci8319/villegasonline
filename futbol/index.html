<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fútbol — Villegas Online</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #1a4a8a;
      --surface:  rgba(255,255,255,0.10);
      --text:     #ffffff;
      --text-sub: rgba(255,255,255,0.55);
      --live:     #ff3b30;
      --live-bg:  rgba(255,59,48,0.18);
    }

    html, body {
      min-height: 100dvh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    header {
      text-align: center;
      padding: 52px 20px 4px;
      user-select: none;
      -webkit-user-select: none;
      pointer-events: none;
    }
    header h1 {
      font-family: "Pinyon Script", cursive;
      font-size: 36px;
      font-weight: 400;
    }

    .fecha {
      text-align: center;
      font-size: 12px;
      color: var(--text-sub);
      letter-spacing: 0.5px;
      padding: 6px 0 14px;
      text-transform: uppercase;
    }

    /* ── Filtros ── */
    .filtros-wrap {
      overflow-x: auto;
      scrollbar-width: none;
      padding: 0 16px 14px;
    }
    .filtros-wrap::-webkit-scrollbar { display: none; }
    .filtros-row { display: flex; gap: 8px; width: max-content; }

    .filtro {
      padding: 6px 16px;
      border-radius: 20px;
      background: var(--surface);
      color: var(--text-sub);
      font-size: 13px;
      font-weight: 500;
      border: none;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      -webkit-tap-highlight-color: transparent;
      white-space: nowrap;
    }
    .filtro.active { background: rgba(255,255,255,0.9); color: var(--bg); font-weight: 600; }
    .filtro .badge {
      display: inline-block;
      background: var(--live);
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      border-radius: 8px;
      padding: 1px 5px;
      margin-left: 4px;
      vertical-align: middle;
    }

    .refresh-info {
      text-align: center;
      font-size: 11px;
      color: var(--text-sub);
      padding-bottom: 8px;
    }

    /* ── Contenido ── */
    .contenido {
      padding: 0 12px 80px;
      max-width: 640px;
      margin: 0 auto;
    }

    /* ── Liga ── */
    .liga-section { margin-bottom: 16px; }

    .liga-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 4px 6px;
    }
    .liga-header img {
      width: 20px;
      height: 20px;
      object-fit: contain;
    }
    .liga-header span {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }

    /* ── Partido ── */
    .partido {
      background: var(--surface);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 4px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 8px;
    }

    .equipo {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }
    .equipo.away { flex-direction: row-reverse; }

    .equipo img {
      width: 24px;
      height: 24px;
      object-fit: contain;
      flex-shrink: 0;
    }

    .equipo-nombre {
      font-size: 14px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .equipo.away .equipo-nombre { text-align: right; }

    /* ── Centro ── */
    .centro {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      flex-shrink: 0;
      min-width: 72px;
    }

    .marcador {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .hora {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-sub);
    }

    .estado-live {
      font-size: 10px;
      font-weight: 700;
      color: var(--live);
      background: var(--live-bg);
      padding: 2px 7px;
      border-radius: 6px;
      letter-spacing: 0.5px;
      animation: pulso 1.5s infinite;
    }

    .estado-ft {
      font-size: 10px;
      color: var(--text-sub);
      letter-spacing: 0.5px;
    }

    @keyframes pulso {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.4; }
    }

    .estado {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-sub);
      font-size: 15px;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <header><h1>Fútbol</h1></header>
  <div class="fecha" id="fecha"></div>

  <div class="filtros-wrap">
    <div class="filtros-row">
      <button class="filtro active" onclick="setFiltro('todos',this)">Todos</button>
      <button class="filtro" onclick="setFiltro('live',this)">En juego <span class="badge" id="badge-live" style="display:none">0</span></button>
      <button class="filtro" onclick="setFiltro('proximos',this)">Próximos</button>
      <button class="filtro" onclick="setFiltro('finalizados',this)">Finalizados</button>
    </div>
  </div>

  <div class="refresh-info" id="refresh-info"></div>
  <div class="contenido" id="contenido"><div class="estado">Cargando...</div></div>

  <script>
    const API_KEY = '8ba9597eac157b648940bdae728644ee';
    const BASE    = 'https://v3.football.api-sports.io';

    // Ligas a mostrar
    const LIGAS = new Set([
      140,  // LaLiga
      141,  // Segunda División
      2,    // Champions League
      3,    // Europa League
      848,  // Conference League
      39,   // Premier League
      78,   // Bundesliga
      135,  // Serie A
      61,   // Ligue 1
      94,   // Primeira Liga
      88,   // Eredivisie
      262,  // Liga MX
      345,  // Copa del Rey
      48,   // FA Cup
      137,  // Coppa Italia
      66,   // Coupe de France
    ]);

    const LIVE_ST = new Set(['1H','HT','2H','ET','BT','P','LIVE']);
    const FT_ST   = new Set(['FT','AET','PEN','ABD','AWD','WO']);

    function tipo(m) {
      const s = m.fixture.status.short;
      if (LIVE_ST.has(s)) return 'live';
      if (FT_ST.has(s))   return 'finalizado';
      return 'proximo';
    }

    function horaLocal(m) {
      return new Date(m.fixture.date).toLocaleTimeString('es', {
        timeZone: 'Europe/Madrid', hour: '2-digit', minute: '2-digit'
      });
    }

    function centroHtml(m) {
      const t = tipo(m);
      const s = m.fixture.status.short;

      if (t === 'proximo') {
        return `<span class="hora">${horaLocal(m)}</span>`;
      }

      const gH = m.goals.home ?? 0;
      const gA = m.goals.away ?? 0;
      const marc = `<span class="marcador">${gH} - ${gA}</span>`;

      if (t === 'live') {
        const min = s === 'HT' ? 'HT' : (m.fixture.status.elapsed ?? '?') + "'";
        return marc + `<span class="estado-live">${min}</span>`;
      }

      const suf = s === 'AET' ? ' ET' : s === 'PEN' ? ' P' : '';
      return marc + `<span class="estado-ft">FT${suf}</span>`;
    }

    function partidoHtml(m) {
      return `
        <div class="partido" data-tipo="${tipo(m)}">
          <div class="equipo home">
            <img src="${m.teams.home.logo}" onerror="this.style.display='none'" loading="lazy">
            <span class="equipo-nombre">${m.teams.home.name}</span>
          </div>
          <div class="centro">${centroHtml(m)}</div>
          <div class="equipo away">
            <img src="${m.teams.away.logo}" onerror="this.style.display='none'" loading="lazy">
            <span class="equipo-nombre">${m.teams.away.name}</span>
          </div>
        </div>`;
    }

    let _filtroActivo = 'todos';
    let _partidos     = [];
    let _timer        = null;

    function setFiltro(f, btn) {
      _filtroActivo = f;
      document.querySelectorAll('.filtro').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderPartidos();
    }
    window.setFiltro = setFiltro;

    function renderPartidos() {
      const cont = document.getElementById('contenido');
      const lista = _filtroActivo === 'todos'       ? _partidos
                  : _filtroActivo === 'live'        ? _partidos.filter(m => tipo(m) === 'live')
                  : _filtroActivo === 'proximos'    ? _partidos.filter(m => tipo(m) === 'proximo')
                  : _partidos.filter(m => tipo(m) === 'finalizado');

      if (!lista.length) {
        cont.innerHTML = '<div class="estado">No hay partidos en este filtro.</div>';
        return;
      }

      const porLiga = {};
      lista.forEach(m => {
        const k = m.league.id;
        if (!porLiga[k]) porLiga[k] = { liga: m.league, lista: [] };
        porLiga[k].lista.push(m);
      });

      Object.values(porLiga).forEach(g =>
        g.lista.sort((a, b) => new Date(a.fixture.date) - new Date(b.fixture.date))
      );

      cont.innerHTML = Object.values(porLiga).map(g => `
        <div class="liga-section">
          <div class="liga-header">
            <img src="${g.liga.logo}" onerror="this.style.display='none'" loading="lazy">
            <span>${g.liga.name}</span>
          </div>
          ${g.lista.map(partidoHtml).join('')}
        </div>`).join('');
    }

    async function cargar(forzar = false) {
      const hoy      = new Date().toLocaleDateString('sv', { timeZone: 'Europe/Madrid' });
      const CLAVE    = 'futbol_apiv3';
      const cache    = JSON.parse(localStorage.getItem(CLAVE) || 'null');

      let partidos;
      let desdCache = false;

      if (!forzar && cache && cache.fecha === hoy) {
        const hayLive = cache.partidos.some(m => LIVE_ST.has(m.fixture.status.short));
        const ttl     = hayLive ? 60_000 : Infinity;
        if (Date.now() - cache.ts < ttl) {
          partidos  = cache.partidos;
          desdCache = true;
        }
      }

      if (!partidos) {
        try {
          const r    = await fetch(`${BASE}/fixtures?date=${hoy}`, {
            headers: { 'x-apisports-key': API_KEY }
          });
          const data = await r.json();
          partidos   = (data.response || []).filter(m => LIGAS.has(m.league.id));
          localStorage.setItem(CLAVE, JSON.stringify({ fecha: hoy, ts: Date.now(), partidos }));
        } catch {
          document.getElementById('contenido').innerHTML =
            '<div class="estado">Error cargando partidos.<br>Comprueba la conexión.</div>';
          return;
        }
      }

      _partidos = partidos;

      const nLive = partidos.filter(m => tipo(m) === 'live').length;
      const badge = document.getElementById('badge-live');
      badge.textContent  = nLive;
      badge.style.display = nLive ? 'inline-block' : 'none';

      renderPartidos();

      const ahora = new Date().toLocaleTimeString('es', {
        timeZone: 'Europe/Madrid', hour: '2-digit', minute: '2-digit'
      });
      document.getElementById('refresh-info').textContent = nLive
        ? `Actualizado a las ${ahora} · refresca cada minuto`
        : `Actualizado a las ${ahora}`;

      if (_timer) clearTimeout(_timer);
      if (nLive) _timer = setTimeout(() => cargar(true), 60_000);
    }

    document.getElementById('fecha').textContent = new Date().toLocaleDateString('es', {
      weekday: 'long', day: 'numeric', month: 'long', timeZone: 'Europe/Madrid'
    });

    cargar();
  </script>
</body>
</html>
