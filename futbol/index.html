<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fútbol — Villegas Online</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #1a4a8a;
      --surface:   rgba(255,255,255,0.10);
      --surface2:  rgba(255,255,255,0.06);
      --text:      #ffffff;
      --text-sub:  rgba(255,255,255,0.55);
      --live:      #ff3b30;
      --live-bg:   rgba(255,59,48,0.18);
      --green:     #34c759;
    }

    html, body {
      min-height: 100dvh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Header ── */
    header {
      text-align: center;
      padding: 52px 20px 4px;
      user-select: none;
      -webkit-user-select: none;
      pointer-events: none;
    }
    header h1 {
      font-family: "Pinyon Script", cursive;
      font-size: 36px;
      font-weight: 400;
    }

    /* ── Fecha ── */
    .fecha {
      text-align: center;
      font-size: 12px;
      color: var(--text-sub);
      letter-spacing: 0.5px;
      padding: 6px 0 16px;
      text-transform: uppercase;
    }

    /* ── Filtros ── */
    .filtros-wrap {
      overflow-x: auto;
      scrollbar-width: none;
      padding: 0 16px 16px;
    }
    .filtros-wrap::-webkit-scrollbar { display: none; }
    .filtros-row {
      display: flex;
      gap: 8px;
      width: max-content;
    }
    .filtro {
      padding: 6px 16px;
      border-radius: 20px;
      background: var(--surface);
      color: var(--text-sub);
      font-size: 13px;
      font-weight: 500;
      border: none;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      -webkit-tap-highlight-color: transparent;
      white-space: nowrap;
    }
    .filtro.active { background: rgba(255,255,255,0.9); color: var(--bg); font-weight: 600; }
    .filtro .badge {
      display: inline-block;
      background: var(--live);
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      border-radius: 8px;
      padding: 1px 5px;
      margin-left: 4px;
      vertical-align: middle;
    }

    /* ── Contenido ── */
    .contenido {
      padding: 0 12px 80px;
      max-width: 640px;
      margin: 0 auto;
    }

    /* ── Liga ── */
    .liga-section { margin-bottom: 16px; }

    .liga-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 4px 6px;
    }
    .liga-header img {
      width: 20px;
      height: 20px;
      object-fit: contain;
    }
    .liga-header span {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }

    /* ── Partido ── */
    .partido {
      background: var(--surface);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 4px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 8px;
    }

    .equipo {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }
    .equipo.away { flex-direction: row-reverse; }

    .equipo img {
      width: 24px;
      height: 24px;
      object-fit: contain;
      flex-shrink: 0;
    }
    .equipo-nombre {
      font-size: 14px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .equipo.away .equipo-nombre { text-align: right; }

    /* ── Centro (marcador / hora) ── */
    .centro {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      flex-shrink: 0;
      min-width: 72px;
    }

    .marcador {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .hora {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-sub);
    }

    .estado-live {
      font-size: 10px;
      font-weight: 700;
      color: var(--live);
      background: var(--live-bg);
      padding: 2px 7px;
      border-radius: 6px;
      letter-spacing: 0.5px;
      animation: pulso 1.5s infinite;
    }

    .estado-ft {
      font-size: 10px;
      color: var(--text-sub);
      letter-spacing: 0.5px;
    }

    @keyframes pulso {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.4; }
    }

    /* ── Estado vacío / carga ── */
    .estado {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-sub);
      font-size: 15px;
      line-height: 1.6;
    }

    /* ── Auto-refresh indicator ── */
    .refresh-info {
      text-align: center;
      font-size: 11px;
      color: var(--text-sub);
      padding-bottom: 8px;
    }
  </style>
</head>
<body>

  <header><h1>Fútbol</h1></header>
  <div class="fecha" id="fecha"></div>

  <div class="filtros-wrap">
    <div class="filtros-row">
      <button class="filtro active" onclick="setFiltro('todos',this)">Todos</button>
      <button class="filtro" onclick="setFiltro('live',this)">En juego <span class="badge" id="badge-live" style="display:none">0</span></button>
      <button class="filtro" onclick="setFiltro('proximos',this)">Próximos</button>
      <button class="filtro" onclick="setFiltro('finalizados',this)">Finalizados</button>
    </div>
  </div>

  <div class="refresh-info" id="refresh-info"></div>
  <div class="contenido" id="contenido"><div class="estado">Cargando...</div></div>

  <script>
    const API_KEY  = '377f6b2cdamsh3512a63c8914e18p1d56a8jsn5d27e0e9aede';
    const API_HOST = 'free-api-live-football-data.p.rapidapi.com';

    // ── IDs de ligas a mostrar (filtro para no mostrar ligas irrelevantes)
    const LIGAS_MOSTRAR = new Set([87,42,73,47,54,55,53,77,138,132,62,52,218,271,108,203]);

    const LIGAS_NOMBRE = {
      87:'LaLiga', 42:'Champions League', 73:'Europa League', 47:'Premier League',
      54:'Bundesliga', 55:'Serie A', 53:'Ligue 1', 77:'Mundial', 138:'Copa del Rey',
      132:'FA Cup', 62:'Liga Portugal', 52:'Eredivisie', 218:'Liga MX', 271:'Superliga',
      108:'J-League', 203:'Super Lig'
    };

    // statusId → tipo
    function tipoPartido(m) {
      const s = m.statusId;
      if ([6,7,11,12].includes(s)) return 'finalizado';
      if ([2,3,4,5,8,9,10].includes(s)) return 'live';
      return 'proximo';
    }

    function horaLocal(utcStr) {
      return new Date(utcStr).toLocaleTimeString('es', {
        timeZone: 'Europe/Madrid', hour: '2-digit', minute: '2-digit'
      });
    }

    function logoLiga(id)  { return `https://images.fotmob.com/image_resources/logo/leaguelogo/dark/${id}.png`; }
    function logoEquipo(id){ return `https://images.fotmob.com/image_resources/logo/teamlogo/${id}.png`; }

    function estadoHtml(m, tipo) {
      if (tipo === 'live') {
        const min = m.status?.liveTime?.short || '?\'';
        return `<span class="estado-live">${min}</span>`;
      }
      if (tipo === 'finalizado') return `<span class="estado-ft">FT</span>`;
      return '';
    }

    function centroHtml(m, tipo) {
      if (tipo === 'proximo') {
        return `<span class="hora">${horaLocal(m.status.utcTime)}</span>`;
      }
      return `<span class="marcador">${m.home.score ?? 0} - ${m.away.score ?? 0}</span>
              ${estadoHtml(m, tipo)}`;
    }

    function partidoHtml(m) {
      const tipo = tipoPartido(m);
      return `
        <div class="partido" data-tipo="${tipo}">
          <div class="equipo home">
            <img src="${logoEquipo(m.home.id)}" onerror="this.style.display='none'" loading="lazy">
            <span class="equipo-nombre">${m.home.name}</span>
          </div>
          <div class="centro">${centroHtml(m, tipo)}</div>
          <div class="equipo away">
            <img src="${logoEquipo(m.away.id)}" onerror="this.style.display='none'" loading="lazy">
            <span class="equipo-nombre">${m.away.name}</span>
          </div>
        </div>`;
    }

    let _filtroActivo = 'todos';
    let _partidos = [];

    function setFiltro(f, btn) {
      _filtroActivo = f;
      document.querySelectorAll('.filtro').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderPartidos();
    }
    window.setFiltro = setFiltro;

    function renderPartidos() {
      const cont = document.getElementById('contenido');
      const partidos = _filtroActivo === 'todos'  ? _partidos
                     : _filtroActivo === 'live'   ? _partidos.filter(m => tipoPartido(m) === 'live')
                     : _filtroActivo === 'proximos'   ? _partidos.filter(m => tipoPartido(m) === 'proximo')
                     : _partidos.filter(m => tipoPartido(m) === 'finalizado');

      if (!partidos.length) {
        cont.innerHTML = '<div class="estado">No hay partidos en este filtro.</div>';
        return;
      }

      // Agrupar por liga
      const porLiga = {};
      partidos.forEach(m => {
        if (!LIGAS_MOSTRAR.has(m.leagueId)) return;
        if (!porLiga[m.leagueId]) porLiga[m.leagueId] = [];
        porLiga[m.leagueId].push(m);
      });

      if (!Object.keys(porLiga).length) {
        cont.innerHTML = '<div class="estado">No hay partidos en este filtro.</div>';
        return;
      }

      cont.innerHTML = Object.entries(porLiga).map(([ligaId, ms]) => `
        <div class="liga-section">
          <div class="liga-header">
            <img src="${logoLiga(ligaId)}" onerror="this.style.display='none'" loading="lazy">
            <span>${LIGAS_NOMBRE[ligaId] || 'Otra liga'}</span>
          </div>
          ${ms.map(partidoHtml).join('')}
        </div>
      `).join('');
    }

    async function cargar() {
      const today = new Date().toLocaleDateString('sv', { timeZone: 'Europe/Madrid' }).replace(/-/g,'');
      try {
        const r = await fetch(
          `https://free-api-live-football-data.p.rapidapi.com/football-get-matches-by-date?date=${today}`,
          { headers: { 'x-rapidapi-key': API_KEY, 'x-rapidapi-host': API_HOST } }
        );
        const data = await r.json();
        _partidos = (data.response?.matches || []).filter(m => LIGAS_MOSTRAR.has(m.leagueId));

        // Badge live
        const nLive = _partidos.filter(m => tipoPartido(m) === 'live').length;
        const badge = document.getElementById('badge-live');
        badge.textContent = nLive;
        badge.style.display = nLive ? 'inline-block' : 'none';

        renderPartidos();

        // Próxima actualización
        const ahora = new Date().toLocaleTimeString('es', { timeZone:'Europe/Madrid', hour:'2-digit', minute:'2-digit' });
        document.getElementById('refresh-info').textContent = `Actualizado a las ${ahora} · refresca cada minuto si hay partidos en juego`;

      } catch(e) {
        document.getElementById('contenido').innerHTML = '<div class="estado">Error cargando partidos.<br>Comprueba la conexión.</div>';
      }
    }

    // Fecha de hoy
    document.getElementById('fecha').textContent = new Date().toLocaleDateString('es', {
      weekday:'long', day:'numeric', month:'long', timeZone:'Europe/Madrid'
    });

    cargar();
    // Auto-refresh cada 60s si hay partidos live
    setInterval(() => {
      if (_partidos.some(m => tipoPartido(m) === 'live')) cargar();
    }, 60000);
  </script>
</body>
</html>
