<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fútbol — Villegas Online</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #1a4a8a;
      --surface:  rgba(255,255,255,0.10);
      --text:     #ffffff;
      --text-sub: rgba(255,255,255,0.55);
      --live:     #ff3b30;
      --live-bg:  rgba(255,59,48,0.18);
    }

    html, body {
      min-height: 100dvh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    header {
      text-align: center;
      padding: 52px 20px 4px;
      user-select: none;
      -webkit-user-select: none;
      pointer-events: none;
    }
    header h1 {
      font-family: "Pinyon Script", cursive;
      font-size: 36px;
      font-weight: 400;
    }

    .fecha {
      text-align: center;
      font-size: 12px;
      color: var(--text-sub);
      letter-spacing: 0.5px;
      padding: 6px 0 14px;
      text-transform: uppercase;
    }

    .filtros-wrap {
      overflow-x: auto;
      scrollbar-width: none;
      padding: 0 16px 12px;
    }
    .filtros-wrap::-webkit-scrollbar { display: none; }
    .filtros-row { display: flex; gap: 8px; width: max-content; }

    .filtro {
      padding: 6px 16px;
      border-radius: 20px;
      background: var(--surface);
      color: var(--text-sub);
      font-size: 13px;
      font-weight: 500;
      border: none;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      -webkit-tap-highlight-color: transparent;
      white-space: nowrap;
    }
    .filtro.active { background: rgba(255,255,255,0.9); color: var(--bg); font-weight: 600; }
    .filtro .badge {
      display: inline-block;
      background: var(--live);
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      border-radius: 8px;
      padding: 1px 5px;
      margin-left: 4px;
      vertical-align: middle;
    }

    .refresh-info {
      text-align: center;
      font-size: 11px;
      color: var(--text-sub);
      padding-bottom: 8px;
    }

    .contenido {
      padding: 0 12px 80px;
      max-width: 640px;
      margin: 0 auto;
    }

    .liga-section { margin-bottom: 16px; }

    .liga-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 4px 6px;
    }
    .liga-header img { width: 20px; height: 20px; object-fit: contain; }
    .liga-header span {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }

    .partido {
      background: var(--surface);
      border-radius: 12px;
      padding: 10px 14px;
      margin-bottom: 4px;
    }

    .partido-fila {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 8px;
    }

    .equipo {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }
    .equipo.away { flex-direction: row-reverse; }

    .equipo img { width: 24px; height: 24px; object-fit: contain; flex-shrink: 0; }

    .equipo-nombre {
      font-size: 14px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .equipo.away .equipo-nombre { text-align: right; }

    .centro {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      flex-shrink: 0;
      min-width: 72px;
    }

    .marcador { font-size: 20px; font-weight: 700; letter-spacing: 1px; }
    .hora     { font-size: 16px; font-weight: 600; color: var(--text-sub); }

    .estado-live {
      font-size: 10px;
      font-weight: 700;
      color: var(--live);
      background: var(--live-bg);
      padding: 2px 7px;
      border-radius: 6px;
      letter-spacing: 0.5px;
      animation: pulso 1.5s infinite;
    }
    .estado-ft { font-size: 10px; color: var(--text-sub); letter-spacing: 0.5px; }

    @keyframes pulso {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.4; }
    }

    .canales {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 8px;
      padding-top: 7px;
      border-top: 1px solid rgba(255,255,255,0.08);
    }
    .canal-chip {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 8px;
      color: #fff;
      white-space: nowrap;
    }

    .estado {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-sub);
      font-size: 15px;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <header><h1>Fútbol</h1></header>
  <div class="fecha" id="fecha"></div>

  <div class="filtros-wrap">
    <div class="filtros-row">
      <button class="filtro active" onclick="setFiltro('todos',this)">Todos</button>
      <button class="filtro" onclick="setFiltro('live',this)">En juego <span class="badge" id="badge-live" style="display:none">0</span></button>
      <button class="filtro" onclick="setFiltro('proximos',this)">Próximos</button>
      <button class="filtro" onclick="setFiltro('finalizados',this)">Finalizados</button>
    </div>
  </div>

  <div class="refresh-info" id="refresh-info"></div>
  <div class="contenido" id="contenido"><div class="estado">Cargando...</div></div>

  <script>
    const JSON_URL = '/futbol/partidos.json';

    let _filtro = 'todos';
    let _comps  = [];   // array de competiciones del JSON
    let _timer  = null;

    // ── Fetch con cache-bust por minuto ────────────────────────
    async function fetchPartidos() {
      const bust = Math.floor(Date.now() / 60_000);
      const r = await fetch(`${JSON_URL}?v=${bust}`);
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      return r.json();
    }

    // ── Color de canal ─────────────────────────────────────────
    function colorCanal(name) {
      const s = name.toLowerCase();
      if (s.includes('dazn'))                              return '#0a5a8a';
      if (s.includes('movistar') || s.includes('m+'))     return '#004f9f';
      if (s.includes('laliga') || s.includes('la liga'))  return '#c07000';
      if (s.includes('teledeporte') || s.includes('tve') || s.includes('la 1')) return '#8b0000';
      if (s.includes('bein'))                              return '#7b0000';
      if (s.includes('eurosport'))                         return '#003da5';
      if (s.includes('orange'))                            return '#b54000';
      if (s.includes('gol'))                               return '#005010';
      if (s.includes('espn'))                              return '#c0392b';
      if (s.includes('cbs'))                               return '#005288';
      return 'rgba(255,255,255,0.18)';
    }

    function limpiarCanal(name) {
      // Quita sufijo de país entre paréntesis: "DAZN (Spain)" → "DAZN"
      return name.replace(/\s*\([^)]+\)\s*$/, '').trim();
    }

    // ── Logo de liga via Fotmob ────────────────────────────────
    function ligaLogoHtml(comp) {
      if (!comp.fotmobId) return '';
      const src = `https://www.fotmob.com/image_resources/logo/leaguelogo/${comp.fotmobId}.png`;
      return `<img src="${src}" onerror="this.style.display='none'" loading="lazy">`;
    }

    // ── HTML de la parte central (hora / marcador) ─────────────
    function centroHtml(p) {
      if (p.estado === 'proximo') {
        return `<span class="hora">${p.hora || '–'}</span>`;
      }
      const gL = p.golesLocal ?? 0, gV = p.golesVisitante ?? 0;
      const marc = `<span class="marcador">${gL} - ${gV}</span>`;
      if (p.estado === 'live') {
        const min = p.minuto ? `${p.minuto}'` : 'EN JUEGO';
        return marc + `<span class="estado-live">${min}</span>`;
      }
      return marc + `<span class="estado-ft">FT</span>`;
    }

    // ── HTML de un partido ─────────────────────────────────────
    function partidoHtml(p) {
      const canales = (p.canales || []).map(c => limpiarCanal(c.name)).filter(Boolean);
      const canalesHtml = canales.length
        ? `<div class="canales">${canales.map(c =>
            `<span class="canal-chip" style="background:${colorCanal(c)}">${c}</span>`
          ).join('')}</div>`
        : '';

      const logoL = p.logoLocal
        ? `<img src="${p.logoLocal}" onerror="this.style.display='none'" loading="lazy">`
        : '';
      const logoV = p.logoVisitante
        ? `<img src="${p.logoVisitante}" onerror="this.style.display='none'" loading="lazy">`
        : '';

      return `
        <div class="partido" data-tipo="${p.estado}">
          <div class="partido-fila">
            <div class="equipo home">${logoL}<span class="equipo-nombre">${p.local}</span></div>
            <div class="centro">${centroHtml(p)}</div>
            <div class="equipo away">${logoV}<span class="equipo-nombre">${p.visitante}</span></div>
          </div>
          ${canalesHtml}
        </div>`;
    }

    // ── Render ─────────────────────────────────────────────────
    function setFiltro(f, btn) {
      _filtro = f;
      document.querySelectorAll('.filtro').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderPartidos();
    }
    window.setFiltro = setFiltro;

    function renderPartidos() {
      const cont = document.getElementById('contenido');

      const secciones = _comps
        .map(comp => {
          const lista = _filtro === 'todos'       ? comp.partidos
                      : _filtro === 'live'        ? comp.partidos.filter(p => p.estado === 'live')
                      : _filtro === 'proximos'    ? comp.partidos.filter(p => p.estado === 'proximo')
                      : comp.partidos.filter(p => p.estado === 'finalizado');
          return { comp, lista };
        })
        .filter(s => s.lista.length > 0);

      if (!secciones.length) {
        cont.innerHTML = '<div class="estado">No hay partidos en este filtro.</div>';
        return;
      }

      cont.innerHTML = secciones.map(({ comp, lista }) => `
        <div class="liga-section">
          <div class="liga-header">
            ${ligaLogoHtml(comp)}
            <span>${comp.nombre}</span>
          </div>
          ${lista.map(partidoHtml).join('')}
        </div>`).join('');
    }

    // ── Carga principal ────────────────────────────────────────
    async function cargar() {
      try {
        const data = await fetchPartidos();
        _comps = data.competiciones || [];

        const todosPartidos = _comps.flatMap(c => c.partidos);
        const nLive = todosPartidos.filter(p => p.estado === 'live').length;

        const badge = document.getElementById('badge-live');
        badge.textContent   = nLive;
        badge.style.display = nLive ? 'inline-block' : 'none';

        renderPartidos();

        // Mostrar cuándo se actualizó el JSON
        const actualizado = new Date(data.actualizado);
        const hace = Math.round((Date.now() - actualizado.getTime()) / 60_000);
        const infoTexto = hace <= 1
          ? 'Actualizado hace un momento'
          : `Actualizado hace ${hace} min`;
        document.getElementById('refresh-info').textContent =
          nLive ? infoTexto + ' · refresca cada minuto' : infoTexto;

        if (_timer) clearTimeout(_timer);
        _timer = setTimeout(cargar, nLive ? 60_000 : 5 * 60_000);

      } catch (e) {
        document.getElementById('contenido').innerHTML =
          '<div class="estado">Error cargando partidos.<br>Comprueba la conexión.</div>';
      }
    }

    document.getElementById('fecha').textContent = new Date().toLocaleDateString('es', {
      weekday: 'long', day: 'numeric', month: 'long', timeZone: 'Europe/Madrid'
    });

    cargar();
  </script>
</body>
</html>
