<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Memory - Parejas</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      background: #1a4a8a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      font-family: 'Courier New', monospace;
      overflow-x: hidden;
    }

    h1 {
      color: #f5a623;
      font-size: clamp(1.6rem, 7vw, 2.4rem);
      letter-spacing: 4px;
      text-shadow: 4px 4px 0 #7b4f00;
      margin-bottom: 4px;
    }

    /* ── Level pills ── */
    .levels {
      display: flex;
      gap: 8px;
      margin: 10px 0 14px;
    }

    .lvl-btn {
      background: #0f3270;
      color: #aaa;
      border: 2px solid #2255a0;
      border-radius: 20px;
      padding: 4px 14px;
      font-family: 'Courier New', monospace;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s;
      touch-action: manipulation;
    }

    .lvl-btn.active {
      background: #f5a623;
      color: #1a4a8a;
      border-color: #f5a623;
      font-weight: bold;
    }

    /* ── Info bar ── */
    .info {
      display: flex;
      gap: 20px;
      margin-bottom: 14px;
      color: #ccc;
      font-size: 0.9rem;
      letter-spacing: 1px;
    }

    .info strong { color: #f5a623; font-size: 1.1rem; }

    /* ── Grid ── */
    .grid-wrap {
      width: min(440px, 96vw);
    }

    .grid {
      display: grid;
      gap: clamp(7px, 2vw, 12px);
    }

    /* ── Cards ── */
    .card {
      aspect-ratio: 1;
      perspective: 700px;
      cursor: pointer;
      user-select: none;
    }

    .card-inner {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.45s cubic-bezier(.4,2,.6,1);
    }

    .card.flipped .card-inner,
    .card.matched .card-inner { transform: rotateY(180deg); }

    .card-front, .card-back {
      position: absolute;
      inset: 0;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      font-size: clamp(1.4rem, 8vw, 2.6rem);
    }

    .card-front {
      background: #0f3270;
      border: 3px solid #0a2560;
      color: #5580bb;
      font-size: clamp(1.2rem, 6vw, 2rem);
    }

    .card-back {
      background: #0f3270;
      border: 3px solid #2255a0;
      transform: rotateY(180deg);
    }

    /* matched regular */
    .card.matched .card-back {
      background: #145a32;
      border-color: #2ecc71;
      box-shadow: 0 0 16px #2ecc7155;
    }

    /* lucky star card */
    .card.lucky .card-front  { border-color: #f5a623; color: #f5a623; }
    .card.lucky .card-back   { background: #7d6608; border-color: #f5a623; }
    .card.lucky.matched .card-back {
      background: #7d6608;
      border-color: #f5a623;
      box-shadow: 0 0 20px #f5a62366;
    }

    /* pop animation */
    .card.matched .card-inner { animation: pop 0.35s cubic-bezier(.4,2,.6,1); }

    @keyframes pop {
      0%   { transform: rotateY(180deg) scale(1); }
      50%  { transform: rotateY(180deg) scale(1.2); }
      100% { transform: rotateY(180deg) scale(1); }
    }

    /* ── Buttons ── */
    .btn {
      margin-top: 18px;
      background: #e94560;
      color: #fff;
      border: none;
      border-bottom: 4px solid #8b1a2e;
      padding: 11px 32px;
      font-family: 'Courier New', monospace;
      font-size: 0.95rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.1s, border-bottom-width 0.1s;
      touch-action: manipulation;
    }
    .btn:active { transform: translateY(3px); border-bottom-width: 1px; }

    /* ── Win overlay ── */
    .win-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.9);
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 200;
      gap: 10px;
      text-align: center;
      padding: 20px;
    }
    .win-overlay.show { display: flex; }

    .win-emoji {
      font-size: 5rem;
      animation: zoomIn 0.5s cubic-bezier(.4,2,.6,1);
    }
    @keyframes zoomIn {
      from { transform: scale(0) rotate(-180deg); opacity: 0; }
      to   { transform: scale(1) rotate(0deg);    opacity: 1; }
    }

    .win-title {
      color: #f5a623;
      font-size: clamp(1.6rem, 7vw, 2.6rem);
      text-shadow: 3px 3px 0 #7b4f00;
      letter-spacing: 3px;
    }
    .win-msg  { color: #ddd; font-size: 1rem; letter-spacing: 1px; }
    .win-next { color: #aaa; font-size: 0.85rem; margin-top: 4px; }

    .win-btns { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; margin-top: 10px; }

    .btn-next {
      background: #2ecc71;
      border-bottom-color: #1a7a43;
    }

    /* ── Confetti ── */
    .confetti-piece {
      position: fixed;
      border-radius: 2px;
      animation: fall linear forwards;
      pointer-events: none;
      z-index: 300;
    }
    @keyframes fall {
      0%   { top: -20px; opacity: 1; }
      100% { top: 110vh;  opacity: 0; }
    }
  </style>
</head>
<body>

  <h1>MEMORY</h1>

  <div class="levels" id="levelBtns"></div>

  <div class="info">
    <span>Parejas: <strong id="pairs">0</strong>/<strong id="total">0</strong></span>
    <span>Intentos: <strong id="tries">0</strong></span>
  </div>

  <div class="grid-wrap">
    <div class="grid" id="grid"></div>
  </div>

  <button class="btn" onclick="init()">Nueva partida</button>

  <!-- Win screen -->
  <div class="win-overlay" id="winOverlay">
    <div class="win-emoji" id="winEmoji">🎉</div>
    <div class="win-title" id="winTitle">¡Ganaste!</div>
    <div class="win-msg"  id="winMsg"></div>
    <div class="win-next" id="winNext"></div>
    <div class="win-btns">
      <button class="btn" onclick="closeWin()">Repetir</button>
      <button class="btn btn-next" id="btnNext" onclick="nextLevel()">Siguiente ▶</button>
    </div>
  </div>

<script>
  // ── Level definitions ──────────────────────────────────────────────────────
  // 3×3 = 9 cards (odd) → 4 pairs + 1 "lucky star" comodín
  const LEVELS = [
    { cols: 2, rows: 2, label: '2×2' },
    { cols: 3, rows: 2, label: '2×3' },
    { cols: 3, rows: 3, label: '3×3', lucky: true },
    { cols: 4, rows: 3, label: '3×4' },
  ];

  const ALL_EMOJIS = ['🐶','🐱','🐭','🐰','🦊','🐻','🐼','🐸','🐯','🦁','🐮','🐷'];
  const LUCKY_EMOJI = '⭐';
  const CONFETTI_COLORS = ['#f5a623','#e94560','#2ecc71','#3498db','#9b59b6','#fff'];

  let currentLevel = 0;
  let flipped = [], matched = 0, tries = 0, locked = false, totalPairs = 0;
  let confettiPieces = [];

  // ── Build level selector ───────────────────────────────────────────────────
  function buildLevelBtns() {
    const wrap = document.getElementById('levelBtns');
    wrap.innerHTML = '';
    LEVELS.forEach((lv, i) => {
      const b = document.createElement('button');
      b.className = 'lvl-btn' + (i === currentLevel ? ' active' : '');
      b.textContent = lv.label;
      b.onclick = () => { currentLevel = i; init(); };
      wrap.appendChild(b);
    });
  }

  // ── Init / render ──────────────────────────────────────────────────────────
  function init() {
    matched = 0; tries = 0; flipped = []; locked = false;
    clearConfetti();
    document.getElementById('winOverlay').classList.remove('show');
    buildLevelBtns();

    const lv = LEVELS[currentLevel];
    const total = lv.cols * lv.rows;
    const hasLucky = !!lv.lucky;
    const pairsCount = hasLucky ? (total - 1) / 2 : total / 2;
    totalPairs = hasLucky ? pairsCount + 1 : pairsCount; // lucky counts as 1 extra

    document.getElementById('total').textContent = totalPairs;
    document.getElementById('pairs').textContent  = '0';
    document.getElementById('tries').textContent  = '0';

    // pick emojis
    const chosen = shuffle(ALL_EMOJIS).slice(0, pairsCount);
    let cards = shuffle([...chosen, ...chosen]);
    if (hasLucky) {
      // insert lucky at a random position
      const pos = Math.floor(Math.random() * (cards.length + 1));
      cards.splice(pos, 0, LUCKY_EMOJI);
    }

    const grid = document.getElementById('grid');
    grid.style.gridTemplateColumns = `repeat(${lv.cols}, 1fr)`;
    grid.innerHTML = '';

    cards.forEach(emoji => {
      const isLucky = emoji === LUCKY_EMOJI;
      const card = document.createElement('div');
      card.className = 'card' + (isLucky ? ' lucky' : '');
      card.dataset.emoji = emoji;
      card.innerHTML = `
        <div class="card-inner">
          <div class="card-front">${isLucky ? '✨' : '⭐'}</div>
          <div class="card-back">${emoji}</div>
        </div>`;
      card.addEventListener('click', () => flip(card));
      grid.appendChild(card);
    });
  }

  // ── Flip logic ─────────────────────────────────────────────────────────────
  function flip(card) {
    if (locked || card.classList.contains('flipped') || card.classList.contains('matched')) return;
    card.classList.add('flipped');

    // lucky star: auto-match immediately
    if (card.classList.contains('lucky')) {
      setTimeout(() => {
        card.classList.add('matched');
        matched++;
        document.getElementById('pairs').textContent = matched;
        if (matched === totalPairs) setTimeout(showWin, 400);
      }, 500);
      return;
    }

    flipped.push(card);

    if (flipped.length === 2) {
      locked = true;
      tries++;
      document.getElementById('tries').textContent = tries;

      const [a, b] = flipped;
      if (a.dataset.emoji === b.dataset.emoji) {
        a.classList.add('matched');
        b.classList.add('matched');
        matched++;
        document.getElementById('pairs').textContent = matched;
        flipped = [];
        locked = false;
        if (matched === totalPairs) setTimeout(showWin, 400);
      } else {
        setTimeout(() => {
          a.classList.remove('flipped');
          b.classList.remove('flipped');
          flipped = [];
          locked = false;
        }, 900);
      }
    }
  }

  // ── Win screen ─────────────────────────────────────────────────────────────
  function showWin() {
    const isLast = currentLevel === LEVELS.length - 1;
    const perfect = tries <= totalPairs + 1;

    document.getElementById('winEmoji').textContent = perfect ? '🏆' : '🎉';
    document.getElementById('winTitle').textContent = isLast ? '¡Campeón!' : '¡Ganaste!';
    document.getElementById('winMsg').textContent   =
      perfect ? '¡Memoria increíble! 🌟' : `Lo lograste en ${tries} intentos. ¡Bien hecho!`;
    document.getElementById('winNext').textContent  =
      isLast ? '¡Has completado todos los niveles! 🎊' : '';

    const btnNext = document.getElementById('btnNext');
    btnNext.style.display = isLast ? 'none' : 'inline-block';

    document.getElementById('winOverlay').classList.add('show');
    launchConfetti();
  }

  function closeWin() {
    document.getElementById('winOverlay').classList.remove('show');
    clearConfetti();
    init();
  }

  function nextLevel() {
    if (currentLevel < LEVELS.length - 1) currentLevel++;
    document.getElementById('winOverlay').classList.remove('show');
    clearConfetti();
    init();
  }

  // ── Confetti ───────────────────────────────────────────────────────────────
  function launchConfetti() {
    for (let i = 0; i < 70; i++) {
      setTimeout(() => {
        const el = document.createElement('div');
        el.className = 'confetti-piece';
        const size = 6 + Math.random() * 10;
        el.style.cssText = `
          left:${Math.random()*100}vw;
          width:${size}px; height:${size}px;
          background:${CONFETTI_COLORS[Math.floor(Math.random()*CONFETTI_COLORS.length)]};
          animation-duration:${1.4+Math.random()*2}s;
          animation-delay:${Math.random()*0.4}s;
          transform:rotate(${Math.random()*360}deg);
        `;
        document.body.appendChild(el);
        confettiPieces.push(el);
      }, i * 35);
    }
  }

  function clearConfetti() {
    confettiPieces.forEach(el => el.remove());
    confettiPieces = [];
  }

  // ── Utils ──────────────────────────────────────────────────────────────────
  function shuffle(arr) { return arr.slice().sort(() => Math.random() - 0.5); }

  // ── Start ──────────────────────────────────────────────────────────────────
  init();
</script>
</body>
</html>
