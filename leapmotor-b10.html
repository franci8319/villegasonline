<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leapmotor B10 — Batería y autonomía</title>
  <link rel="icon" type="image/png" href="leapmotor-icon.png" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=VT323&family=Oswald:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --azul:      #1a4a8a;
      --azul-dark: #0D3A70;
      --naranja:   #D4520A;
      --verde:     #3A7A1A;
      --rojo:      #C41E1E;
      --fondo:     #EDE8DF;
      --panel:     #F5F0E8;
      --panel2:    #E8E2D8;
      --gold:      #B8860B;
      --gold-lt:   #D4A017;
      --metal:     #7A8A9A;
      --txt:       #1A1208;
      --txt-dim:   #6A5A3A;
      --border:    #B8A888;
    }

    html, body {
      min-height: 100dvh;
      background: var(--fondo);
      color: var(--txt);
      font-family: 'Oswald', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Header ── */
    .app-header {
      background: var(--azul);
      color: #fff;
      padding: 14px 16px;
      border-bottom: 4px solid var(--azul-dark);
      box-shadow: 0 3px 0 var(--gold);
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .hdr-title { font-family: 'Bebas Neue', 'Oswald', sans-serif; font-size: 22px; letter-spacing: 3px; line-height: 1.1; }
    .hdr-sub   { font-family: 'Oswald', sans-serif; font-size: 11px; color: rgba(255,255,255,.75); letter-spacing: 1px; text-transform: uppercase; margin-top: 2px; }

    .hdr-back {
      flex-shrink: 0;
      background: none;
      border: 2px solid rgba(255,255,255,.4);
      color: rgba(255,255,255,.85);
      padding: 6px 10px;
      font-family: 'Oswald', sans-serif;
      font-size: 12px;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-decoration: none;
    }
    .hdr-back:hover { border-color: #fff; color: #fff; }

    /* ── Layout ── */
    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 18px 14px 60px;
      gap: 14px;
    }

    /* ── Cards ── */
    .card {
      background: var(--panel);
      border: 2px solid var(--border);
      box-shadow: 4px 4px 0 rgba(0,0,0,.12);
      padding: 16px 16px 14px;
      width: min(440px, 100%);
    }

    .card-title {
      font-family: 'Bebas Neue', 'Oswald', sans-serif;
      font-size: 18px;
      color: var(--azul);
      letter-spacing: 2px;
      text-transform: uppercase;
      border-bottom: 2px solid var(--border);
      padding-bottom: 8px;
      margin-bottom: 12px;
    }

    /* ── Fields ── */
    label {
      display: block;
      font-family: 'Oswald', sans-serif;
      font-size: 12px;
      font-weight: 600;
      color: var(--azul);
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 7px;
    }

    input[type="number"] {
      width: 100%;
      padding: 10px 12px;
      border: 2px solid var(--border);
      background: #fff;
      color: var(--txt);
      font-family: 'Oswald', sans-serif;
      font-size: 15px;
      margin-bottom: 14px;
    }

    input[type="number"]:focus { border-color: var(--azul); outline: none; box-shadow: 3px 3px 0 rgba(26,74,138,.2); }
    input[type="number"]::placeholder { color: var(--metal); }

    /* ── Segmented toggle (version / tipo de carga) ── */
    .seg-tabs {
      display: flex;
      gap: 0;
      margin-bottom: 14px;
      background: var(--panel2);
      border: 2px solid var(--border);
      padding: 2px;
    }

    .seg-tab {
      flex: 1;
      text-align: center;
      padding: 8px 4px;
      font-family: 'Oswald', sans-serif;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--txt-dim);
      cursor: pointer;
      margin-bottom: 0;
    }

    .seg-tab input { display: none; }
    .seg-tab:has(input:checked) { background: var(--azul); color: #fff; }

    /* ── Hero result (tiempo de carga) ── */
    .hero-result {
      background: var(--azul);
      color: #fff;
      border: 3px solid var(--azul-dark);
      box-shadow: 5px 5px 0 var(--azul-dark);
      padding: 14px 16px 12px;
      margin: 4px 0 14px;
      text-align: center;
    }

    .hero-label { font-family: 'Oswald', sans-serif; font-size: 11px; color: rgba(255,255,255,.7); letter-spacing: 2px; text-transform: uppercase; }
    .hero-value { font-family: 'Bebas Neue', 'Oswald', sans-serif; font-size: 38px; margin: 4px 0; line-height: 1; letter-spacing: 2px; }
    .hero-sub   { font-family: 'Oswald', sans-serif; font-size: 12px; color: var(--gold-lt); min-height: 14px; margin-top: 2px; }

    /* ── Result rows ── */
    .results { margin-top: 2px; }

    .result-row, .range-compare {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 7px 0;
      border-bottom: 1px solid var(--border);
      font-family: 'Oswald', sans-serif;
      font-size: 13px;
      color: var(--txt-dim);
      letter-spacing: .5px;
      text-transform: uppercase;
    }
    .result-row:last-of-type, .range-compare:last-of-type { border-bottom: none; }

    .result-row strong, .range-compare strong {
      font-family: 'VT323', monospace;
      font-size: 19px;
      color: var(--azul);
      text-transform: none;
      letter-spacing: 0;
    }

    .note { font-family: 'Oswald', sans-serif; font-size: 12px; margin-top: 8px; min-height: 14px; }
    .note.error { color: var(--rojo); font-weight: 600; }
  </style>
</head>
<body>

  <header class="app-header">
    <div>
      <div class="hdr-title">LEAPMOTOR B10</div>
      <div class="hdr-sub">Batería y autonomía</div>
    </div>
    <a class="hdr-back" href="/index.html">← Volver</a>
  </header>

  <main>

    <section class="card" id="sec-coche">
      <h2 class="card-title">Datos del coche</h2>

      <div class="seg-tabs">
        <label class="seg-tab"><input type="radio" id="version55" name="version" value="55" /> 55 kWh</label>
        <label class="seg-tab"><input type="radio" id="version65" name="version" value="65" checked /> 65 kWh</label>
      </div>

      <label for="capInput">Capacidad útil (kWh)</label>
      <input type="number" id="capInput" min="1" step="0.1" value="65" />

      <label for="wltpRangeInput">Autonomía WLTP (km)</label>
      <input type="number" id="wltpRangeInput" min="1" step="1" value="434" />

      <label for="consWltpInput">Consumo medio WLTP (kWh/100km)</label>
      <input type="number" id="consWltpInput" min="0.1" step="0.1" value="17.3" />
    </section>

    <section class="card" id="sec-carga">
      <h2 class="card-title">Carga</h2>

      <label for="curPctInput">Batería actual (%)</label>
      <input type="number" id="curPctInput" min="0" max="100" step="1" value="20" />

      <label for="tgtPctInput">Batería objetivo (%)</label>
      <input type="number" id="tgtPctInput" min="0" max="100" step="1" value="80" />

      <div class="seg-tabs">
        <label class="seg-tab"><input type="radio" id="chargeTypeAC" name="chargeType" value="AC" checked /> AC (≤11 kW)</label>
        <label class="seg-tab"><input type="radio" id="chargeTypeDC" name="chargeType" value="DC" /> DC rápida</label>
      </div>

      <label for="chargerKwInput">Potencia del punto de carga (kW)</label>
      <input type="number" id="chargerKwInput" min="0" step="0.1" placeholder="ej. 7.4, 11, 50, 150..." />

      <label for="priceInput">Precio de la luz (€/kWh) — opcional</label>
      <input type="number" id="priceInput" min="0" step="0.01" placeholder="ej. 0.15" />

      <div class="hero-result">
        <div class="hero-label">Tiempo estimado de carga</div>
        <div class="hero-value" id="resTime">—</div>
        <div class="hero-sub" id="resWarning"></div>
      </div>

      <div class="results">
        <div class="result-row"><span>Energía a cargar</span><strong id="resEnergy">—</strong></div>
        <div class="result-row"><span>Potencia efectiva</span><strong id="resPower">—</strong></div>
        <div class="result-row"><span>Coste de la carga</span><strong id="resCost">—</strong></div>
      </div>
      <p class="note error" id="resError"></p>
    </section>

    <section class="card" id="sec-autonomia">
      <h2 class="card-title">Autonomía</h2>

      <label for="consRealInput">Consumo real (kWh/100km)</label>
      <input type="number" id="consRealInput" min="0.1" step="0.1" value="17.3" />

      <div class="results">
        <div class="range-compare">
          <span>Actual — WLTP</span><strong id="rangeCurWltp">—</strong>
        </div>
        <div class="range-compare">
          <span>Actual — real</span><strong id="rangeCurReal">—</strong>
        </div>
        <div class="range-compare">
          <span>Objetivo — WLTP</span><strong id="rangeTgtWltp">—</strong>
        </div>
        <div class="range-compare">
          <span>Objetivo — real</span><strong id="rangeTgtReal">—</strong>
        </div>
      </div>
    </section>

    <section class="card" id="sec-coste">
      <h2 class="card-title">Coste</h2>

      <div class="results">
        <div class="result-row"><span>Batería completa (0→100%)</span><strong id="resCostFull">—</strong></div>
        <div class="result-row"><span>100 km — WLTP</span><strong id="resCost100Wltp">—</strong></div>
        <div class="result-row"><span>100 km — real</span><strong id="resCost100Real">—</strong></div>
      </div>
    </section>

  </main>

  <script>
    // ── Pure calculation functions ──────────────────────────────────────────
    function kwhToCharge(curPct, tgtPct, capacityKwh) {
      return (tgtPct - curPct) / 100 * capacityKwh;
    }

    function maxChargerKw(chargeType, version) {
      if (chargeType === 'AC') return 11;
      return version === '55' ? 140 : 168;
    }

    function effectivePowerKw(chargerKw, chargeType, version) {
      return Math.min(chargerKw, maxChargerKw(chargeType, version));
    }

    function chargeTimeHours(energyKwh, powerKw) {
      return energyKwh / powerKw;
    }

    function rangeKm(pct, capacityKwh, consumptionKwh100km) {
      return pct / 100 * capacityKwh / consumptionKwh100km * 100;
    }

    function chargeCost(energyKwh, pricePerKwh) {
      return energyKwh * pricePerKwh;
    }

    function formatTime(hoursFloat) {
      if (!isFinite(hoursFloat) || hoursFloat <= 0) return '—';
      const totalMin = Math.round(hoursFloat * 60);
      const h = Math.floor(totalMin / 60);
      const m = totalMin % 60;
      return h > 0 ? `${h} h ${m} min` : `${m} min`;
    }

    function formatNumber(n, decimals) {
      if (!isFinite(n)) return '—';
      return n.toLocaleString('es-ES', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
    }

    // ── Version presets ──────────────────────────────────────────────────────
    const VERSIONS = {
      '55': { capacity: 55, wltpRange: 361, wltpConsumption: 15.2 },
      '65': { capacity: 65, wltpRange: 434, wltpConsumption: 17.3 },
    };

    const el = (id) => document.getElementById(id);

    function applyVersionPreset() {
      const version = el('version55').checked ? '55' : '65';
      const preset = VERSIONS[version];
      el('capInput').value = preset.capacity;
      el('wltpRangeInput').value = preset.wltpRange;
      el('consWltpInput').value = preset.wltpConsumption;
      el('consRealInput').value = preset.wltpConsumption;
    }

    function currentVersion() {
      return el('version55').checked ? '55' : '65';
    }

    function recalculate() {
      const curPct = parseFloat(el('curPctInput').value);
      const tgtPct = parseFloat(el('tgtPctInput').value);
      const capacity = parseFloat(el('capInput').value);
      const consWltp = parseFloat(el('consWltpInput').value);
      const consReal = parseFloat(el('consRealInput').value);
      const chargerKw = parseFloat(el('chargerKwInput').value);
      const price = parseFloat(el('priceInput').value);
      const chargeType = el('chargeTypeAC').checked ? 'AC' : 'DC';
      const version = currentVersion();

      if (price > 0) {
        el('resCostFull').textContent = `${formatNumber(chargeCost(capacity, price), 2)} €`;
        el('resCost100Wltp').textContent = `${formatNumber(chargeCost(consWltp, price), 2)} €`;
        el('resCost100Real').textContent = `${formatNumber(chargeCost(consReal, price), 2)} €`;
      } else {
        el('resCostFull').textContent = '—';
        el('resCost100Wltp').textContent = '—';
        el('resCost100Real').textContent = '—';
      }

      if (!(tgtPct > curPct)) {
        el('resError').textContent = 'El objetivo debe ser mayor que el nivel actual.';
        el('resEnergy').textContent = '—';
        el('resPower').textContent = '—';
        el('resTime').textContent = '—';
        el('resCost').textContent = '—';
        el('resWarning').textContent = '';
        el('rangeCurWltp').textContent = '—';
        el('rangeCurReal').textContent = '—';
        el('rangeTgtWltp').textContent = '—';
        el('rangeTgtReal').textContent = '—';
        return;
      }
      el('resError').textContent = '';

      const energy = kwhToCharge(curPct, tgtPct, capacity);
      el('resEnergy').textContent = `${formatNumber(energy, 1)} kWh`;

      if (chargerKw > 0) {
        const power = effectivePowerKw(chargerKw, chargeType, version);
        const hours = chargeTimeHours(energy, power);
        el('resPower').textContent = `${formatNumber(power, 1)} kW`;
        el('resTime').textContent = formatTime(hours);
      } else {
        el('resPower').textContent = '—';
        el('resTime').textContent = '—';
      }

      if (price > 0) {
        el('resCost').textContent = `${formatNumber(chargeCost(energy, price), 2)} €`;
      } else {
        el('resCost').textContent = '—';
      }

      el('resWarning').textContent = (chargeType === 'DC' && tgtPct > 80)
        ? 'La carga rápida DC se ralentiza a partir del 80%, el tiempo real puede ser algo mayor.'
        : '';

      el('rangeCurWltp').textContent = `${formatNumber(rangeKm(curPct, capacity, consWltp), 0)} km`;
      el('rangeCurReal').textContent = `${formatNumber(rangeKm(curPct, capacity, consReal), 0)} km`;
      el('rangeTgtWltp').textContent = `${formatNumber(rangeKm(tgtPct, capacity, consWltp), 0)} km`;
      el('rangeTgtReal').textContent = `${formatNumber(rangeKm(tgtPct, capacity, consReal), 0)} km`;
    }

    document.querySelectorAll('#version55, #version65').forEach((radio) => {
      radio.addEventListener('change', () => { applyVersionPreset(); recalculate(); });
    });

    document.querySelectorAll(
      '#capInput, #wltpRangeInput, #consWltpInput, #curPctInput, #tgtPctInput, ' +
      '#chargerKwInput, #priceInput, #consRealInput'
    ).forEach((input) => input.addEventListener('input', recalculate));

    document.querySelectorAll('#chargeTypeAC, #chargeTypeDC').forEach((radio) => {
      radio.addEventListener('change', recalculate);
    });

    recalculate();
  </script>

</body>
</html>
