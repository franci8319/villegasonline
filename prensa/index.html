<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prensa — Villegas Online</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #1a4a8a;
      --text: #ffffff;
      --text-sub: rgba(255,255,255,0.6);
      --card: rgba(255,255,255,0.12);
      --card-hover: rgba(255,255,255,0.2);
      --tab-active-bg: rgba(255,255,255,0.92);
      --tab-active-text: #1a4a8a;
    }

    html, body {
      min-height: 100dvh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text",
                   "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      padding: 52px 20px 24px;
      gap: 8px;
    }

    .back {
      display: flex;
      align-items: center;
      color: rgba(255,255,255,0.75);
      text-decoration: none;
      font-size: 16px;
      gap: 2px;
      margin-right: 4px;
      -webkit-tap-highlight-color: transparent;
    }
    .back svg { width: 20px; height: 20px; }

    header h1 {
      font-family: "Pinyon Script", cursive;
      font-size: 32px;
      font-weight: 400;
    }

    /* ── Week tabs ── */
    .weeks-wrap {
      overflow-x: auto;
      scrollbar-width: none;
      padding: 0 20px 20px;
    }
    .weeks-wrap::-webkit-scrollbar { display: none; }

    .weeks-row {
      display: flex;
      gap: 8px;
      width: max-content;
    }

    .tab {
      padding: 7px 18px;
      border-radius: 20px;
      background: var(--card);
      color: var(--text-sub);
      font-size: 13px;
      font-weight: 500;
      border: none;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .tab.active {
      background: var(--tab-active-bg);
      color: var(--tab-active-text);
      font-weight: 600;
    }

    /* ── PDF grid ── */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      padding: 4px 20px 60px;
      max-width: 560px;
      margin: 0 auto;
    }

    @media (min-width: 480px) {
      .grid { grid-template-columns: repeat(3, 1fr); }
    }

    .pdf-card {
      background: var(--card);
      border-radius: 14px;
      padding: 18px 12px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: inherit;
      transition: background 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .pdf-card:active { background: var(--card-hover); }

    .pdf-icon {
      width: 44px;
      height: 56px;
      background: rgba(255,255,255,0.18);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: rgba(255,255,255,0.85);
      position: relative;
    }
    .pdf-icon::after {
      content: '';
      position: absolute;
      top: 0; right: 0;
      width: 12px; height: 12px;
      background: var(--bg);
      border-radius: 0 6px 0 6px;
    }

    .pdf-name {
      font-size: 12px;
      font-weight: 500;
      text-align: center;
      line-height: 1.35;
      color: var(--text);
    }

    /* ── Estados ── */
    .state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 48px 20px;
      color: var(--text-sub);
      font-size: 15px;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <header>
    <a href="/" class="back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 18l-6-6 6-6"/>
      </svg>
    </a>
    <h1>Prensa</h1>
  </header>

  <div class="weeks-wrap">
    <div class="weeks-row" id="tabs"></div>
  </div>

  <div class="grid" id="grid">
    <div class="state">Cargando...</div>
  </div>

  <script>
    // ── CONFIGURACIÓN ─────────────────────────────────────
    const SUPABASE_URL = 'https://ioobowfkwhoeahokupxa.supabase.co';
    const ANON_KEY     = 'sb_publishable_wDYczAI_Xz0Uqg-bfPQBUw_nz7oKT5H';
    const BUCKET       = 'prensa';
    // ──────────────────────────────────────────────────────

    async function listar(prefix) {
      const r = await fetch(`${SUPABASE_URL}/storage/v1/object/list/${BUCKET}`, {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${ANON_KEY}`,
          'Content-Type':  'application/json'
        },
        body: JSON.stringify({ prefix, limit: 200, sortBy: { column: 'name', order: 'desc' } })
      });
      return r.json();
    }

    function semanaLabel(folder) {
      // folder = "2026-20" → calcula rango de fechas de esa semana ISO
      const [anio, sem] = folder.split('-').map(Number);
      const ene4 = new Date(anio, 0, 4);
      const lunes = new Date(ene4);
      lunes.setDate(ene4.getDate() - ((ene4.getDay() || 7) - 1) + (sem - 1) * 7);
      const domingo = new Date(lunes);
      domingo.setDate(lunes.getDate() + 6);
      const fmt = new Intl.DateTimeFormat('es', { day: 'numeric', month: 'short' });
      return `${fmt.format(lunes)} – ${fmt.format(domingo)}`;
    }

    function nombreLimpio(filename) {
      // Quita extensión y prefijos de fecha tipo "15-05-26-" o "15-05-26 "
      return filename
        .replace(/\.pdf$/i, '')
        .replace(/^\d{2}-\d{2}-\d{2}[-\s]/, '')
        .replace(/^\d{2}-\d{2}-/, '')
        .trim();
    }

    function urlPdf(carpeta, nombre) {
      return `${SUPABASE_URL}/storage/v1/object/public/${BUCKET}/${carpeta}/${encodeURIComponent(nombre)}`;
    }

    async function mostrarSemana(carpeta) {
      const grid = document.getElementById('grid');
      grid.innerHTML = '<div class="state">Cargando...</div>';

      const items = await listar(carpeta);
      const pdfs  = items.filter(i => i.id && i.name.toLowerCase().endsWith('.pdf'));

      if (!pdfs.length) {
        grid.innerHTML = '<div class="state">No hay PDFs esta semana.</div>';
        return;
      }

      grid.innerHTML = pdfs.map(f => `
        <a class="pdf-card" href="${urlPdf(carpeta, f.name)}">
          <div class="pdf-icon">PDF</div>
          <span class="pdf-name">${nombreLimpio(f.name)}</span>
        </a>
      `).join('');
    }

    async function init() {
      const tabsEl = document.getElementById('tabs');
      const grid   = document.getElementById('grid');

      const items    = await listar('');
      const carpetas = items
        .filter(i => !i.id)
        .map(i => i.name)
        .sort()
        .reverse();

      if (!carpetas.length) {
        grid.innerHTML = '<div class="state">Aún no hay periódicos subidos.<br>Vuelve mañana.</div>';
        return;
      }

      tabsEl.innerHTML = carpetas.map((c, i) => `
        <button class="tab ${i === 0 ? 'active' : ''}"
                onclick="seleccionar('${c}', this)">
          ${semanaLabel(c)}
        </button>
      `).join('');

      mostrarSemana(carpetas[0]);
    }

    window.seleccionar = (carpeta, btn) => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
      mostrarSemana(carpeta);
    };

    init();
  </script>
</body>
</html>
